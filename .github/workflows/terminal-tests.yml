name: Terminal tests

on:
  push:
    branches: [next]
  workflow_dispatch:

jobs:
  native_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with: { fetch-depth: 0, submodules: true }
      - name: Setup Python
        uses: actions/setup-python@v6
        with: { python-version: '3.x' }
      - name: Install Meson
        run: python -m pip install meson ninja
      - name: Run Native Tests
        run: |
          meson setup build -Dapi_include_dir=lib/pragtical/resources/include -Dbuildtype=debug
          meson test -C build --print-errorlogs
          if ($LASTEXITCODE -ne 0) {
            $diagnostic = & .\build\terminal-native-components-test.exe 2>&1
            $test_exit = $LASTEXITCODE
            $detail = ($diagnostic -join ' ') -replace '\r?\n', ' '
            Write-Output "::error title=Windows terminal native test::exit=$test_exit $detail"
            exit $test_exit
          }

  native_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with: { fetch-depth: 0, submodules: true }
      - name: Setup Python
        uses: actions/setup-python@v6
        with: { python-version: '3.x' }
      - name: Install Meson
        run: python -m pip install meson ninja
      - name: Run Native Tests
        run: |
          meson setup build -Dapi_include_dir=lib/pragtical/resources/include -Dbuildtype=debug
          meson test -C build --print-errorlogs

  native_macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with: { fetch-depth: 0, submodules: true }
      - name: Setup Python
        uses: actions/setup-python@v6
        with: { python-version: '3.x' }
      - name: Install Meson
        run: python -m pip install meson ninja
      - name: Run Native Tests
        run: |
          meson setup build -Dapi_include_dir=lib/pragtical/resources/include -Dbuildtype=debug
          meson test -C build --print-errorlogs
